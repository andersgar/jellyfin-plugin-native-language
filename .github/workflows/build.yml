name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - jellyfin: 10.10.7
            tfm: net8.0
          - jellyfin: 10.11.11
            tfm: net9.0
          - jellyfin: 12.1.0
            tfm: net10.0
    name: build (Jellyfin ${{ matrix.jellyfin }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: >
          dotnet build Jellyfin.Plugin.NativeLanguage/Jellyfin.Plugin.NativeLanguage.csproj -c Release
          -p:JellyfinVersion=${{ matrix.jellyfin }} -p:JellyfinTfm=${{ matrix.tfm }}
